<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <!-- Fullscreen / app-like behaviour when launched from a home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wedding Jotter">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="Tobore Wedding Jotter - A Luxury Fullscreen Flip Ebook and Digital Wedding Magazine.">
  <title>Tobore Wedding Jotter | Luxury Flip Magazine</title>

  <!-- Google Fonts for Luxury Editorial Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container" id="app-container">
    <div class="ambient-glow"></div>

    <!-- Top Navigation Header -->
    <header class="top-bar">
      <div class="brand">
        <!-- Luxury Wedding Ring/Emblem SVG -->
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="12" r="6"></circle>
          <circle cx="16" cy="12" r="6"></circle>
          <path d="M12 7l1-2h2l1 2"></path>
        </svg>
        <h1 class="brand-title">Tobore Wedding Jotter</h1>
      </div>

      <!-- Current Page Counter / Status Badge -->
      <div class="page-indicator-badge" id="page-indicator">
        Loading Magazine...
      </div>

      <!-- Top Quick Action Icons -->
      <div class="top-actions">
        <button id="btn-settings" class="ctrl-btn tooltip" data-tooltip="Settings & Page Count" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Interactive Book Stage -->
    <main class="book-stage" id="book-stage">
      <!-- Floating Side Chevron Arrows -->
      <button class="nav-arrow prev" id="side-prev" aria-label="Previous Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Flipbook Container -->
      <div id="flipbook-viewport">
        <div id="flipbook">
          <!-- Pages dynamically created by js/magazine.js -->
        </div>
      </div>

      <button class="nav-arrow next" id="side-next" aria-label="Next Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </main>

    <!-- Glassmorphic Bottom Control Dock -->
    <footer class="bottom-dock">
      <!-- First Page -->
      <button id="btn-first" class="ctrl-btn tooltip" data-tooltip="First Page (Cover)" aria-label="First Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5"></line>
        </svg>
      </button>

      <!-- Previous Page -->
      <button id="btn-prev" class="ctrl-btn tooltip" data-tooltip="Previous (←)" aria-label="Previous Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Page Scrubber Slider -->
      <div class="scrubber-container">
        <input type="range" class="scrubber-slider" id="page-scrubber" min="1" max="12" value="1" aria-label="Page Scrubber">
      </div>

      <!-- Next Page -->
      <button id="btn-next" class="ctrl-btn tooltip" data-tooltip="Next (→ or Space)" aria-label="Next Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <!-- Last Page -->
      <button id="btn-last" class="ctrl-btn tooltip" data-tooltip="Last Page (End)" aria-label="Last Page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>

      <div class="dock-divider"></div>

      <!-- Auto-Play Slideshow -->
      <button id="btn-play" class="ctrl-btn tooltip" data-tooltip="Auto Play Slideshow" aria-label="Auto Play Slideshow">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>

      <!-- Page Flip Sound Toggle -->
      <button id="btn-sound" class="ctrl-btn tooltip" data-tooltip="Page Turning Sound" aria-label="Toggle Sound">
        <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="sound-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Thumbnails Drawer Grid -->
      <button id="btn-thumbs" class="ctrl-btn tooltip" data-tooltip="Page Thumbnails" aria-label="Show Thumbnails">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
    </footer>

    <!-- Compulsory Fullscreen Gate (browsers only allow fullscreen after a tap/click) -->
    <div class="fs-gate active" id="fs-gate" role="dialog" aria-modal="true" aria-labelledby="fs-gate-title">
      <div class="fs-gate-card">
        <svg class="fs-gate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="12" r="6"></circle>
          <circle cx="16" cy="12" r="6"></circle>
          <path d="M12 7l1-2h2l1 2"></path>
        </svg>
        <div class="fs-gate-ornament">❧ ❦ ☙</div>
        <h2 class="fs-gate-title" id="fs-gate-title">Tobore Wedding Jotter</h2>
        <p class="fs-gate-text" id="fs-gate-text">This magazine is designed to be enjoyed in full screen.</p>
        <button class="btn-primary fs-gate-btn" id="btn-enter-fs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span id="btn-enter-fs-label">Open Magazine in Full Screen</span>
        </button>
        <p class="fs-gate-hint">Tap or press <kbd>Enter</kbd> to begin</p>
      </div>
    </div>

    <!-- Thumbnails Sheet Modal -->
    <div class="modal-overlay" id="thumbs-modal">
      <div class="thumbnails-sheet">
        <div class="sheet-header">
          <div class="sheet-title">Magazine Overview &amp; Pages</div>
          <button class="close-sheet-btn" id="btn-close-thumbs" aria-label="Close Overview">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="thumbnails-grid" id="thumbs-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- Quick Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
      <div class="settings-modal">
        <div class="sheet-header" style="padding: 0 0 0.8rem 0;">
          <div class="sheet-title">Magazine Settings</div>
          <button class="close-sheet-btn" id="btn-close-settings" aria-label="Close Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="settings-group">
          <label class="settings-label" for="input-total-pages">Total Number of Pages</label>
          <input type="number" id="input-total-pages" class="settings-input" min="2" max="200" value="12">
          <span style="font-size: 0.75rem; color: #7f8596;">Match this number to how many images (1.jpg, 2.jpg...) you have in the images folder.</span>
        </div>

        <button id="btn-save-settings" class="btn-primary">Apply &amp; Refresh Magazine</button>
      </div>
    </div>

  </div>

  <!-- JavaScript Libraries: jQuery & Turn.js (Local copies with fallback) -->
  <script src="js/jquery.min.js"></script>
  <script src="js/turn.min.js"></script>

  <!-- Magazine Flip Logic -->
  <script src="js/magazine.js"></script>
</body>
</html>
